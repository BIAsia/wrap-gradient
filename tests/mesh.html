<!DOCTYPE html>
<!-- Preset: Soft Bubble 泡沫 | Type: Mesh Gradient -->
<html>
<head>
<meta charset="utf-8">
<title>Mesh — Soft Bubble 泡沫</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #F5EBD9; }
  canvas { display: block; }
  .label {
    position: fixed; bottom: 28px; left: 28px;
    font: 12px/1 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(80,60,120,0.22); pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Soft Bubble 泡沫 · Mesh</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

const VS = `attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FS = `
precision highp float;
uniform float u_time;
uniform vec2  u_resolution;

/* ── Simplex 2D ───────────────────────────────────────────────── */
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0)) + i.x + vec3(0.0,i1.x,1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0*fract(p*C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
  vec3 g;
  g.x  = a0.x *x0.x  + h.x *x0.y;
  g.yz = a0.yz*x12.xz + h.yz*x12.yw;
  return 130.0 * dot(m, g);
}

/* ── Palette: Soft Bubble 泡沫 ────────────────────────────────── */
vec3 p0 = vec3(0.961, 0.922, 0.851);  // #F5EBD9 warm white
vec3 p1 = vec3(0.949, 0.831, 0.859);  // #F2D4DB blush
vec3 p2 = vec3(0.922, 0.741, 0.871);  // #EBBDDE soft pink
vec3 p3 = vec3(0.800, 0.729, 0.890);  // #CCBAE3 lavender
vec3 p4 = vec3(0.549, 0.749, 0.941);  // #8CBFF0 sky blue
vec3 p5 = vec3(0.471, 0.690, 1.000);  // #78B0FF periwinkle

/* ── Main ─────────────────────────────────────────────────────── */
void main(){
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float aspect = u_resolution.x / u_resolution.y;
  vec2 st = vec2(uv.x * aspect, uv.y);
  float t = u_time * 0.12;

  // 6 control points with slow orbital drifts
  vec2 cp0 = vec2(0.22 + 0.10*sin(t*0.71      ), 0.28 + 0.08*cos(t*0.53      ));
  vec2 cp1 = vec2(0.80 + 0.08*sin(t*0.43 + 2.1), 0.14 + 0.10*cos(t*0.82 + 1.5));
  vec2 cp2 = vec2(0.52 + 0.12*sin(t*0.62 + 4.2), 0.84 + 0.08*cos(t*0.37 + 3.0));
  vec2 cp3 = vec2(0.10 + 0.06*cos(t*0.91 + 1.3), 0.66 + 0.09*sin(t*0.58 + 2.5));
  vec2 cp4 = vec2(0.88 + 0.07*sin(t*0.55 + 3.7), 0.52 + 0.07*cos(t*0.45 + 0.8));
  vec2 cp5 = vec2(0.48 + 0.09*cos(t*0.38 + 5.0), 0.42 + 0.11*sin(t*0.65 + 4.1));

  // Scale control points to aspect-corrected space
  cp0.x *= aspect; cp1.x *= aspect; cp2.x *= aspect;
  cp3.x *= aspect; cp4.x *= aspect; cp5.x *= aspect;

  // Gaussian weights — sigma controls spread (lower = wider)
  float sigma = 3.2;
  float w0 = exp(-sigma * dot(st-cp0, st-cp0));
  float w1 = exp(-sigma * dot(st-cp1, st-cp1));
  float w2 = exp(-sigma * dot(st-cp2, st-cp2));
  float w3 = exp(-sigma * dot(st-cp3, st-cp3));
  float w4 = exp(-sigma * dot(st-cp4, st-cp4));
  float w5 = exp(-sigma * dot(st-cp5, st-cp5));

  // Subtle noise perturbation to weights — breaks mathematical perfection
  float nw = snoise(st * 3.0 + t * 0.1) * 0.08;
  w0 += nw * w0;
  w1 -= nw * w1;
  w2 += nw * 0.5 * w2;

  float total = w0 + w1 + w2 + w3 + w4 + w5 + 0.0001;

  // Normalized weighted color blend
  vec3 col = (p0*w0 + p1*w1 + p2*w2 + p3*w3 + p4*w4 + p5*w5) / total;

  // Very subtle grain to add texture
  float grain = snoise(gl_FragCoord.xy * 0.8) * 0.012;
  col += grain;

  gl_FragColor = vec4(col, 1.0);
}
`;

/* ── WebGL boilerplate ────────────────────────────────────────── */
function compileShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(ap);
gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog,'u_time');
const uRes  = gl.getUniformLocation(prog,'u_resolution');

function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize); resize();

(function frame(ts){
  gl.uniform1f(uTime, ts * 0.001);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
})(0);
</script>
</body>
</html>
