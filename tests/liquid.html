<!DOCTYPE html>
<!-- Preset: Floral 花漾 | Type: Liquid Gradient -->
<html>
<head>
<meta charset="utf-8">
<title>Liquid — Floral 花漾</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
  .label {
    position: fixed; bottom: 28px; left: 28px;
    font: 12px/1 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.2); pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Floral 花漾 · Liquid</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

const VS = `attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FS = `
precision highp float;
uniform float u_time;
uniform vec2  u_resolution;

/* ── Simplex 2D (Ashima Arts) ─────────────────────────────────── */
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0)) + i.x + vec3(0.0,i1.x,1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0*fract(p*C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
  vec3 g;
  g.x  = a0.x *x0.x  + h.x *x0.y;
  g.yz = a0.yz*x12.xz + h.yz*x12.yw;
  return 130.0 * dot(m, g);
}

/* ── FBM ──────────────────────────────────────────────────────── */
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8776, 0.4794, -0.4794, 0.8776);
  for(int i = 0; i < 5; i++){
    v += a * snoise(p);
    p = rot * p * 2.0;
    a *= 0.5;
  }
  return v;
}

/* ── Palette: Floral 花漾 ─────────────────────────────────────── */
vec3 c0 = vec3(0.788, 0.859, 0.471);  // #C9DB78  yellow-green
vec3 c1 = vec3(0.980, 0.718, 0.376);  // #FAB760  warm peach
vec3 c2 = vec3(1.000, 0.576, 0.639);  // #FF93A3  salmon
vec3 c3 = vec3(0.933, 0.557, 0.796);  // #EE8ECB  mauve

vec3 palette(float t){
  t = clamp(t, 0.0, 1.0);
  if(t < 0.33) return mix(c0, c1, t / 0.33);
  if(t < 0.66) return mix(c1, c2, (t - 0.33) / 0.33);
  return mix(c2, c3, (t - 0.66) / 0.34);
}

/* ── Main ─────────────────────────────────────────────────────── */
void main(){
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float aspect = u_resolution.x / u_resolution.y;
  vec2 p = vec2(uv.x * aspect, uv.y);
  float t = u_time * 0.08;

  // Large-scale warp: low-frequency noise moves color regions
  vec2 warp = vec2(
    fbm(p * 1.2 + vec2(t * 0.3,  t * 0.2)),
    fbm(p * 1.2 + vec2(t * 0.2, -t * 0.3) + 50.0)
  );

  // Secondary warp for richer organic motion
  vec2 warp2 = vec2(
    snoise((p + warp * 0.6) * 1.8 + t * 0.15),
    snoise((p + warp * 0.6) * 1.8 + t * 0.12 + 30.0)
  );

  vec2 warped = uv + warp * 0.18 + warp2 * 0.06;

  // Sample a smooth noise field with the warped coords
  float n = fbm(warped * 1.5 + t * 0.05);
  n = n * 0.5 + 0.5;

  // Anchor to a diagonal gradient so colors have spatial structure
  float diag = warped.x * 0.55 + warped.y * 0.45;
  float sample = mix(n, diag, 0.40);
  sample = smoothstep(0.08, 0.92, sample);

  vec3 col = palette(sample);

  // Subtle vignette
  vec2 vc = uv - 0.5;
  col *= 1.0 - dot(vc, vc) * 0.4;

  gl_FragColor = vec4(col, 1.0);
}
`;

/* ── WebGL boilerplate ────────────────────────────────────────── */
function compileShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(ap);
gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog,'u_time');
const uRes  = gl.getUniformLocation(prog,'u_resolution');

function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize); resize();

(function frame(ts){
  gl.uniform1f(uTime, ts * 0.001);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
})(0);
</script>
</body>
</html>
